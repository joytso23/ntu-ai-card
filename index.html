<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTU AI Society - Digital Card</title>
  <!-- 載入樣式與圖示套件 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 載入 Supabase 套件 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- 主要外框容器 -->
  <div id="app" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative z-10 my-8">
    <div id="loading" class="text-center py-10">
      <p class="text-slate-400 animate-pulse">載入名片資料中...</p>
    </div>
    <div id="content" class="hidden"></div>
  </div>

  <script>
    // ⬇️ 1. 請在這裡填入你的 Supabase 資訊 (保留單引號 ' ')
    const SUPABASE_URL = 'https://hhxwldpwoiegjosjpgla.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeHdsZHB3b2llZ2pvc2pwZ2xhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTY5NjEsImV4cCI6MjEwMjI3Mjk2MX0.bsEDol7G951_VPwp5gxq7ItNtyhPLLjcUAopbvNkvC8';

    let supabaseClient;

    async function init() {
      try {
        // 初始化 Supabase 連線
        if (window.supabase) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
          throw new Error("Supabase 套件載入失敗，請重新整理頁面。");
        }

        // 讀取 URL 網址後方的卡片編號 (例如 /c/003 -> 取出 003)
        const pathSegments = window.location.pathname.split('/');
        const cardId = pathSegments[pathSegments.length - 1] || '001';

        // 至資料庫查詢資料
        const { data, error } = await supabaseClient
          .from('cards')
          .select('*')
          .eq('card_id', cardId)
          .maybeSingle();

        document.getElementById('loading').classList.add('hidden');
        const contentDiv = document.getElementById('content');
        contentDiv.classList.remove('hidden');

        // 判斷該卡片是否已經設定過
        if (data && data.is_active) {
          renderCard(data, contentDiv);
        } else {
          renderForm(cardId, contentDiv);
        }
      } catch (err) {
        document.getElementById('loading').innerHTML = `<p class="text-red-400 text-sm text-center">發生錯誤：${err.message}</p>`;
      }
    }

    // 渲染「建立名片表單」
    function renderForm(id, container) {
      container.innerHTML = `
        <header class="text-center mb-6">
          <span class="text-xs text-cyan-400 bg-slate-800/80 border border-slate-700 px-3 py-1 rounded-full">NTU AI Society</span>
          <h1 class="text-2xl font-bold mt-3 text-white">Create Your Digital Card</h1>
          <p class="text-xs text-slate-400 mt-1">正在綁定卡片：<span class="text-purple-400 font-bold">#${id}</span></p>
        </header>
        
        <form onsubmit="saveCard(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">中文姓名 *</label>
              <input type="text" id="name_zh" required placeholder="王小明" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">英文姓名</label>
              <input type="text" id="name_en" placeholder="Alex Wang" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">學校 *</label>
              <input type="text" id="school" value="國立臺灣大學" required class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">系所 / 年級</label>
              <input type="text" id="department" placeholder="資工系 R12" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">社團職位 / 身份</label>
            <input type="text" id="title" placeholder="AI 社社員 / 技術部部長" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>

          <div class="space-y-2 pt-2">
            <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">社群連結</label>
            <input type="text" id="instagram" placeholder="Instagram 帳號 (例: ntu.ai)" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            <input type="url" id="linkedin" placeholder="LinkedIn 網址" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            <input type="text" id="github" placeholder="GitHub 帳號" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            <input type="url" id="portfolio" placeholder="個人網站 / Portfolio 網址" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>

          <div class="pt-2">
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-medium text-slate-300">About Me</label>
              <button type="button" onclick="generateAIBio()" class="text-xs text-cyan-400 hover:text-cyan-300 flex items-center gap-1">
                <span>✨ AI 幫我生成</span>
              </button>
            </div>
            <textarea id="bio" rows="3" placeholder="簡短介紹一下你自己..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500 resize-none"></textarea>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-indigo-500 to-purple-600 hover:opacity-90 text-white font-bold rounded-xl shadow-lg mt-4 transition-all">
            建立我的電子名片
          </button>
        </form>
      `;
      lucide.createIcons();
    }

    // 渲染「電子名片展示頁」
    function renderCard(data, container) {
      container.innerHTML = `
        <div class="text-center py-4">
          <div class="w-20 h-20 mx-auto rounded-full bg-slate-800 border-2 border-cyan-400 flex items-center justify-center text-2xl font-bold text-cyan-400 mb-4 shadow-lg shadow-cyan-500/20">
            ${data.name_zh ? data.name_zh[0] : 'AI'}
          </div>
          <h1 class="text-2xl font-bold text-white">${data.name_zh} <span class="text-sm font-normal text-slate-400 block sm:inline">${data.name_en || ''}</span></h1>
          <p class="text-cyan-400 text-sm font-medium mt-1">${data.school} ${data.department || ''}</p>
          <p class="text-slate-400 text-xs mt-0.5">${data.title || ''}</p>
          
          <div class="mt-5 p-4 bg-slate-800/50 border border-slate-700/50 rounded-2xl text-left">
            <p class="text-xs font-semibold text-slate-400 mb-1">About Me</p>
            <p class="text-slate-200 text-sm leading-relaxed">${data.bio || '這個人很懶，還沒寫自我介紹～'}</p>
          </div>

          <div class="mt-6 flex justify-center items-center gap-3">
            ${data.instagram ? `<a href="https://instagram.com/${data.instagram}" target="_blank" class="p-3 bg-slate-800 border border-slate-700 rounded-xl text-pink-400 hover:scale-105 transition-transform"><i data-lucide="instagram" class="w-5 h-5"></i></a>` : ''}
            ${data.linkedin ? `<a href="${data.linkedin}" target="_blank" class="p-3 bg-slate-800 border border-slate-700 rounded-xl text-blue-400 hover:scale-105 transition-transform"><i data-lucide="linkedin" class="w-5 h-5"></i></a>` : ''}
            ${data.github ? `<a href="https://github.com/${data.github}" target="_blank" class="p-3 bg-slate-800 border border-slate-700 rounded-xl text-slate-200 hover:scale-105 transition-transform"><i data-lucide="github" class="w-5 h-5"></i></a>` : ''}
            ${data.portfolio ? `<a href="${data.portfolio}" target="_blank" class="p-3 bg-slate-800 border border-slate-700 rounded-xl text-cyan-400 hover:scale-105 transition-transform"><i data-lucide="globe" class="w-5 h-5"></i></a>` : ''}
          </div>

          <p class="text-[10px] text-slate-500 mt-8">NTU AI Society NFC Digital Card</p>
        </div>
      `;
      lucide.createIcons();
    }

    // ✨ AI 生成簡介功能
    function generateAIBio() {
      const bioInput = document.getElementById('bio');
      const name = document.getElementById('name_zh').value || '社員';
      const dept = document.getElementById('department').value || '台大';
      
      bioInput.value = "AI 思考中...";
      setTimeout(() => {
        bioInput.value = `👋 嗨！我是 ${name}，來自 ${dept}。對 AI 應用與新科技充滿熱情，希望能用技術打造酷炫的產品！歡迎認識交流 🚀`;
      }, 600);
    }

    // 送出並儲存至 Supabase 資料庫
    async function saveCard(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = '儲存中...';
      submitBtn.disabled = true;

      const pathSegments = window.location.pathname.split('/');
      const cardId = pathSegments[pathSegments.length - 1] || '001';

      const cardData = {
        card_id: cardId,
        is_active: true,
        name_zh: document.getElementById('name_zh').value,
        name_en: document.getElementById('name_en').value,
        school: document.getElementById('school').value,
        department: document.getElementById('department').value,
        title: document.getElementById('title').value,
        instagram: document.getElementById('instagram').value,
        linkedin: document.getElementById('linkedin').value,
        github: document.getElementById('github').value,
        portfolio: document.getElementById('portfolio').value,
        bio: document.getElementById('bio').value
      };

      const { error } = await supabaseClient.from('cards').upsert(cardData);
      if (error) {
        alert('儲存失敗：' + error.message);
        submitBtn.innerText = '建立我的電子名片';
        submitBtn.disabled = false;
      } else {
        alert('🎉 名片設定成功！');
        location.reload(); // 重新整理頁面，會自動切換成名片展示頁
      }
    }

    window.onload = init;
  </script>
</body>
</html>
