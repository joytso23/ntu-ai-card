<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTU AI Society - Personal Bio Website</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes glowPulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    .animate-glow {
      animation: glowPulse 7s infinite ease-in-out;
    }
    /* 參考圖範例中的鋸齒/鋸齒卡片邊框效果可透過微光邊框呈現未來感 */
    .block-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(99, 102, 241, 0.25);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .block-card:hover {
      border-color: rgba(6, 182, 212, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.15);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-cyan-500 selection:text-white relative overflow-x-hidden">

  <!-- 未來感靛藍與賽博紫動態光暈 -->
  <div class="fixed top-[-10%] left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-gradient-to-tr from-indigo-900/40 via-purple-900/30 to-cyan-500/20 blur-[120px] pointer-events-none rounded-full animate-glow"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[350px] h-[350px] bg-indigo-600/10 blur-[100px] pointer-events-none rounded-full"></div>

  <!-- 主要容器：精緻的手機/微型網站黃金寬度 (max-w-md) -->
  <div id="app" class="w-full max-w-md bg-slate-900/80 backdrop-blur-2xl border border-indigo-500/20 rounded-[2.5rem] p-6 shadow-2xl relative z-10 my-6">
    <div id="loading" class="text-center py-16">
      <div class="w-10 h-10 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-slate-400 font-mono text-xs tracking-widest animate-pulse">LOADING PERSONAL PORTFOLIO...</p>
    </div>
    <div id="content" class="hidden"></div>
  </div>

  <script>
    // ⚠️ Supabase 設定
    const SUPABASE_URL = 'https://hhxwldpwoiegjosjpgla.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeHdsZHB3b2llZ2pvc2pwZ2xhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTY5NjEsImV4cCI6MjEwMjI3Mjk2MX0.bsEDol7G951_VPwp5gxq7ItNtyhPLLjcUAopbvNkvC8';

    // ⚠️ Gemini API Key
    const GEMINI_API_KEY = 'AQ.Ab8RN6Jep89C77IY6ccqm6tvNSmJ6MiDLbgs5_SlIGWx02pogQ';

    let supabaseClient = null;
    let currentAvatarSeed = 'ntu-ai';

    async function init() {
      const loadingDiv = document.getElementById('loading');
      const contentDiv = document.getElementById('content');

      try {
        if (window.supabase && SUPABASE_URL.includes('.supabase.co')) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const redirectPath = urlParams.get('p');
        let path = redirectPath ? redirectPath : window.location.pathname;
        let pathSegments = path.split('/').filter(Boolean);

        let cardId = pathSegments[pathSegments.length - 1] || '001';
        if (cardId === 'c' || !cardId) cardId = '001';

        let cardData = null;

        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('cards')
            .select('*')
            .eq('card_id', cardId)
            .maybeSingle();

          if (!error && data) {
            cardData = data;
          }
        }

        loadingDiv.classList.add('hidden');
        contentDiv.classList.remove('hidden');

        if (cardData && cardData.is_active) {
          renderCard(cardData, contentDiv);
        } else {
          renderForm(cardId, contentDiv);
        }

      } catch (err) {
        console.error("Init Error:", err);
        loadingDiv.innerHTML = `
          <div class="text-center p-4">
            <p class="text-red-400 font-bold mb-2">⚠️ 系統載入發生錯誤</p>
            <p class="text-xs text-slate-400 bg-slate-950 p-2 rounded border border-slate-800 font-mono">${err.message}</p>
          </div>
        `;
      }
    }

    // 渲染「資料編輯/填寫頁」
    function renderForm(id, container) {
      currentAvatarSeed = `ntu-${id}-${Math.floor(Math.random() * 1000)}`;
      const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${currentAvatarSeed}`;

      container.innerHTML = `
        <header class="text-center mb-6 border-b border-indigo-500/20 pb-4">
          <span class="text-[10px] font-mono tracking-widest text-cyan-400 bg-indigo-950/80 border border-indigo-700/50 px-3 py-1 rounded-full">NTU AI SOCIETY</span>
          <h1 class="text-xl font-bold mt-3 text-white">建立個人網站卡片</h1>
          <p class="text-xs text-slate-400 mt-1 font-mono">綁定卡片編號：<span class="text-purple-400 font-bold">#${id}</span></p>
        </header>
        
        <form onsubmit="saveCard(event)" class="space-y-4">
          
          <!-- Avatar 隨機頭像 -->
          <div class="flex flex-col items-center justify-center mb-2">
            <div class="relative w-20 h-20 rounded-full bg-slate-900 border-2 border-cyan-400 p-1 mb-2 shadow-lg shadow-cyan-500/20">
              <img id="avatarPreview" src="${avatarUrl}" class="w-full h-full object-cover rounded-full" alt="Avatar">
            </div>
            <button type="button" onclick="randomizeAvatar()" class="text-xs text-cyan-300 flex items-center gap-1 bg-indigo-950/80 hover:bg-indigo-900 px-3 py-1 rounded-full border border-indigo-700/50">
              <i data-lucide="refresh-cw" class="w-3 h-3"></i> 換個風格頭像
            </button>
          </div>

          <!-- 基本資料 -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-indigo-200 mb-1">中文姓名 *</label>
              <input type="text" id="name_zh" required placeholder="例：王小明" oninput="updateAvatarSeed()" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-indigo-200 mb-1">英文姓名</label>
              <input type="text" id="name_en" placeholder="例：Alex Wang" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-indigo-200 mb-1">學校 / 單位 *</label>
              <input type="text" id="school" placeholder="例：國立臺灣大學" required class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-indigo-200 mb-1">系所 / 部門</label>
              <input type="text" id="department" placeholder="例：資訊工程學系" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-indigo-200 mb-1">社團職位 / 身份標籤</label>
            <input type="text" id="title" placeholder="例：專案負責人 / 行銷部長" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>

          <!-- 經歷與技能 -->
          <div class="space-y-3 pt-1">
            <div>
              <label class="block text-xs font-medium text-indigo-200 mb-1">重要經歷 / 專案亮點 (供 AI 生成參考)</label>
              <input type="text" id="experience" placeholder="例：台積電實習、ATCC 決賽團隊、區塊鏈研究社" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
            <div>
              <label class="block text-xs font-medium text-indigo-200 mb-1">專業技能 (用逗號分開)</label>
              <input type="text" id="skills" placeholder="例：Python, Digital Marketing, FinTech" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            </div>
          </div>

          <!-- 社群連結與聯絡資訊 -->
          <div class="space-y-2 pt-2">
            <label class="block text-xs font-medium text-indigo-400 uppercase tracking-wider font-mono">聯絡與社群連結</label>
            <input type="email" id="email" placeholder="電子信箱 (例: user@ntu.edu.tw)" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            <input type="text" id="instagram" placeholder="Instagram 帳號 (例: ntu.ai)" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            <input type="url" id="linkedin" placeholder="LinkedIn 個人頁面網址" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            <input type="text" id="github" placeholder="GitHub 帳號" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
            <input type="url" id="portfolio" placeholder="個人作品集 / 官網網址" class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>

          <!-- 客制化 Gemini AI Prompt -->
          <div class="pt-2">
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-medium text-indigo-200">About Me (個人故事簡介)</label>
              <button type="button" onclick="generateGeminiBio()" class="text-xs text-cyan-300 font-semibold flex items-center gap-1 bg-gradient-to-r from-indigo-900 to-purple-900 border border-cyan-500/40 px-2.5 py-1 rounded-lg">
                <i data-lucide="sparkles" class="w-3.5 h-3.5 text-cyan-400"></i>
                <span>✨ 依經歷深度生成</span>
              </button>
            </div>
            <textarea id="bio" rows="3" placeholder="填寫經歷後點擊『✨ 依經歷深度生成』，Gemini 將依據你的經歷與技能寫出專屬的故事簡介..." class="w-full bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500 resize-none leading-relaxed"></textarea>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-cyan-500 hover:opacity-95 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/20 mt-4 transition-all">
            🚀 建立並發佈我的個人網站
          </button>
        </form>
      `;
      if (window.lucide) lucide.createIcons();
    }

    function randomizeAvatar() {
      currentAvatarSeed = `seed-${Math.random().toString(36).substring(7)}`;
      document.getElementById('avatarPreview').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${currentAvatarSeed}`;
    }

    function updateAvatarSeed() {
      const name = document.getElementById('name_zh').value;
      if (name.trim()) {
        currentAvatarSeed = name;
        document.getElementById('avatarPreview').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(name)}`;
      }
    }

    // 🤖 深度 Prompt：讓 Gemini 根據個人經歷客製化撰寫，拒絕罐頭句
    async function generateGeminiBio() {
      const bioInput = document.getElementById('bio');
      const name = document.getElementById('name_zh').value || '社團成員';
      const school = document.getElementById('school').value || '國立臺灣大學';
      const dept = document.getElementById('department').value || '';
      const title = document.getElementById('title').value || '';
      const exp = document.getElementById('experience').value || '';
      const skills = document.getElementById('skills').value || '';

      bioInput.value = "⚡ Gemini 正在分析你的經歷亮點，為你撰寫專屬簡介中...";

      if (GEMINI_API_KEY && GEMINI_API_KEY !== 'YOUR_GEMINI_API_KEY') {
        try {
          const prompt = `你是一位高階科技職涯顧問與個人品牌專家。請根據下方這個人的真實背景資訊，為他/她撰寫一段高質感、具備個人故事特色且自信專業的個人簡介（約 80-120 字），適合放置在個人網站。

【重要撰寫原則】
1. 嚴禁使用罐頭套話（例如：「嗨！我是...，我是一位對...充滿熱情的人」）。
2. 請深刻結合他/她的背景特色（例如：將系所專業、實習經歷或專案經驗進行跨界點綴與融合）。
3. 展現個人亮點與洞察力。
4. 使用第一人稱「我」，語氣自信、接地氣且具備前瞻科技感。

【背景資料】
- 姓名：${name}
- 學校/系所：${school} ${dept}
- 目前身份/職務：${title}
- 重要經歷/專案亮點：${exp}
- 專業技能/標籤：${skills}

請直接輸出最終的簡介本文，不要包含任何開場白或額外解釋。`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          });

          const data = await response.json();
          if (data.candidates && data.candidates[0].content.parts[0].text) {
            bioInput.value = data.candidates[0].content.parts[0].text.trim();
            return;
          }
        } catch (e) {
          console.error("Gemini API Error:", e);
        }
      }

      setTimeout(() => {
        let text = `立足於 ${school} ${dept}，我專注於將學術視野與實務經驗接軌。`;
        if (exp) text += ` 在 ${exp} 等經歷中累積了具體的專案落地能力；`;
        if (title) text += ` 目前擔任 ${title}，`;
        if (skills) text += ` 積極運用 ${skills} 等跨領域技能。`;
        text += ` 期待透過創新思維，持續創造具影響力的解決方案。`;
        bioInput.value = text;
      }, 600);
    }

    // 🎨 參考範例圖：採用「頂部主視覺圓形頭像 + 塊狀行動卡片矩陣 (Linktree/Website Style)」
    function renderCard(data, container) {
      const avatarUrl = data.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(data.name_zh || 'ntu')}`;
      const skillsArray = data.skills ? data.skills.split(',').map(s => s.trim()).filter(Boolean) : [];

      container.innerHTML = `
        <div class="space-y-5">
          
          <!-- Top Bar -->
          <div class="flex items-center justify-between border-b border-indigo-500/20 pb-3">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span class="text-[10px] font-mono text-cyan-400 tracking-widest uppercase">NTU AI PORTFOLIO</span>
            </div>
            <span class="text-[10px] font-mono text-slate-500">#${data.card_id}</span>
          </div>

          <!-- Header 主視覺區（參考範例圖：頂部大型圓形頭像 + 主標題 + 簡介） -->
          <div class="text-center pt-2 pb-2">
            
            <div class="relative inline-block mb-3">
              <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-cyan-400 rounded-full blur opacity-50"></div>
              <div class="relative w-24 h-24 rounded-full bg-slate-900 border-2 border-cyan-400/80 p-1 shadow-2xl overflow-hidden mx-auto">
                <img src="${avatarUrl}" class="w-full h-full object-cover rounded-full" alt="Avatar">
              </div>
            </div>

            <h1 class="text-2xl font-black text-white tracking-tight">${data.name_zh}</h1>
            ${data.name_en ? `<p class="text-xs font-mono text-indigo-300 font-medium mt-0.5">${data.name_en}</p>` : ''}
            
            <p class="text-cyan-400 text-xs font-semibold mt-1.5 flex items-center justify-center gap-1">
              <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i>
              <span>${data.school} ${data.department || ''}</span>
            </p>

            ${data.title ? `
              <div class="mt-2 inline-block px-3 py-1 rounded-full bg-indigo-950/80 border border-indigo-700/60 text-xs font-medium text-indigo-200">
                ${data.title}
              </div>
            ` : ''}

            <!-- 簡介內文區塊 -->
            <p class="text-slate-300 text-xs leading-relaxed mt-4 px-2 font-light text-center">
              ${data.bio || '歡迎來到我的個人網站！'}
            </p>
          </div>

          <!-- 參考範例圖的「獨立長條塊狀卡片矩陣 (Block Cards)」 -->
          <div class="space-y-3 pt-2">

            <!-- 塊狀卡片 1：重要經歷 -->
            ${data.experience ? `
              <div class="block-card p-3.5 rounded-2xl flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-900/60 border border-indigo-700/60 flex items-center justify-center text-cyan-300 shrink-0">
                  <i data-lucide="briefcase" class="w-5 h-5"></i>
                </div>
                <div class="overflow-hidden">
                  <p class="text-[10px] font-mono text-slate-400 uppercase tracking-wider">Experience / 專案經歷</p>
                  <p class="text-xs font-semibold text-white truncate mt-0.5">${data.experience}</p>
                </div>
              </div>
            ` : ''}

            <!-- 塊狀卡片 2：專業技能標籤 -->
            ${skillsArray.length > 0 ? `
              <div class="block-card p-3.5 rounded-2xl">
                <div class="flex items-center gap-2 mb-2">
                  <div class="w-6 h-6 rounded-lg bg-indigo-900/60 border border-indigo-700/60 flex items-center justify-center text-indigo-300">
                    <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
                  </div>
                  <p class="text-[10px] font-mono text-slate-400 uppercase tracking-wider">Skills & Expertise</p>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  ${skillsArray.map(skill => `
                    <span class="px-2.5 py-1 bg-indigo-950/90 border border-indigo-800/60 text-cyan-300 rounded-lg text-[11px] font-mono">
                      ${skill}
                    </span>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <!-- 塊狀卡片 3：電子信箱 -->
            ${data.email ? `
              <a href="mailto:${data.email}" class="block-card p-3.5 rounded-2xl flex items-center justify-between group">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-indigo-900/60 border border-indigo-700/60 flex items-center justify-center text-pink-400">
                    <i data-lucide="mail" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <p class="text-[10px] font-mono text-slate-400 uppercase tracking-wider">Email</p>
                    <p class="text-xs font-semibold text-white">${data.email}</p>
                  </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:text-cyan-400 transition-colors"></i>
              </a>
            ` : ''}

            <!-- 塊狀卡片 4：個人作品集 / 官網 -->
            ${data.portfolio ? `
              <a href="${data.portfolio}" target="_blank" class="block-card p-3.5 rounded-2xl flex items-center justify-between group">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-indigo-900/60 border border-indigo-700/60 flex items-center justify-center text-cyan-400">
                    <i data-lucide="globe" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <p class="text-[10px] font-mono text-slate-400 uppercase tracking-wider">Official Website / Portfolio</p>
                    <p class="text-xs font-semibold text-white truncate max-w-[200px]">${data.portfolio.replace('https://', '').replace('http://', '')}</p>
                  </div>
                </div>
                <i data-lucide="external-link" class="w-4 h-4 text-slate-500 group-hover:text-cyan-400 transition-colors"></i>
              </a>
            ` : ''}

            <!-- 塊狀卡片 5：社群卡片（LinkedIn / IG / GitHub 整合列） -->
            <div class="grid grid-cols-3 gap-2 pt-1">
              ${data.instagram ? `
                <a href="https://instagram.com/${data.instagram}" target="_blank" class="block-card p-3 rounded-xl flex flex-col items-center justify-center text-slate-300 hover:text-pink-400">
                  <i data-lucide="instagram" class="w-5 h-5 mb-1"></i>
                  <span class="text-[10px] font-mono">Instagram</span>
                </a>
              ` : ''}
              ${data.linkedin ? `
                <a href="${data.linkedin}" target="_blank" class="block-card p-3 rounded-xl flex flex-col items-center justify-center text-slate-300 hover:text-blue-400">
                  <i data-lucide="linkedin" class="w-5 h-5 mb-1"></i>
                  <span class="text-[10px] font-mono">LinkedIn</span>
                </a>
              ` : ''}
              ${data.github ? `
                <a href="https://github.com/${data.github}" target="_blank" class="block-card p-3 rounded-xl flex flex-col items-center justify-center text-slate-300 hover:text-purple-400">
                  <i data-lucide="github" class="w-5 h-5 mb-1"></i>
                  <span class="text-[10px] font-mono">GitHub</span>
                </a>
              ` : ''}
            </div>

          </div>

          <!-- Footer -->
          <footer class="text-center pt-4">
            <p class="text-[10px] font-mono text-slate-600">POWERED BY NTU AI SOCIETY • NFC CARD</p>
          </footer>

        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    // 儲存至 Supabase
    async function saveCard(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = '正在發佈個人網站...';
      submitBtn.disabled = true;

      const urlParams = new URLSearchParams(window.location.search);
      const redirectPath = urlParams.get('p');
      let path = redirectPath ? redirectPath : window.location.pathname;
      let pathSegments = path.split('/').filter(Boolean);

      let cardId = pathSegments[pathSegments.length - 1] || '001';
      if (cardId === 'c' || !cardId) cardId = '001';

      const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(currentAvatarSeed)}`;

      const cardData = {
        card_id: cardId,
        is_active: true,
        name_zh: document.getElementById('name_zh').value,
        name_en: document.getElementById('name_en').value,
        school: document.getElementById('school').value,
        department: document.getElementById('department').value,
        title: document.getElementById('title').value,
        experience: document.getElementById('experience').value,
        skills: document.getElementById('skills').value,
        email: document.getElementById('email').value,
        instagram: document.getElementById('instagram').value,
        linkedin: document.getElementById('linkedin').value,
        github: document.getElementById('github').value,
        portfolio: document.getElementById('portfolio').value,
        bio: document.getElementById('bio').value,
        avatar_url: avatarUrl
      };

      if (supabaseClient) {
        const { error } = await supabaseClient.from('cards').upsert(cardData);
        if (error) {
          alert('儲存失敗：' + error.message);
          submitBtn.innerText = '🚀 建立並發佈我的個人網站';
          submitBtn.disabled = false;
          return;
        }
      }

      alert('🎉 個人網站發佈成功！');
      location.reload();
    }

    window.onload = init;
  </script>
</body>
