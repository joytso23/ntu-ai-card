<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子名片系統 (全加密版)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- CryptoJS (AES & SHA256) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 font-sans text-slate-800">

  <div class="max-w-2xl mx-auto space-y-8">
    
    <!-- 標頭 -->
    <header class="text-center">
      <h1 class="text-3xl font-bold text-slate-900 mb-2">個人電子名片系統</h1>
      <p class="text-sm text-slate-500">端到端全欄位 AES 加密防護，資料庫亦無法解密內容</p>
    </header>

    <!-- 表單卡片：建立 / 編輯電子名片 -->
    <div id="formContainer" class="bg-white rounded-xl shadow-md p-6 border border-slate-200">
      <div class="flex justify-between items-center mb-6 border-b pb-3">
        <h2 id="formTitle" class="text-xl font-bold text-slate-800">建立個人名片</h2>
        <span id="editBadge" class="hidden bg-amber-100 text-amber-800 text-xs px-2.5 py-0.5 rounded-full font-medium">編輯模式</span>
      </div>

      <form id="cardForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        
        <!-- 隱藏的名片 ID (編輯時使用) -->
        <input type="hidden" id="cardId" value="">

        <!-- 基本資料 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">姓名 *</label>
            <input type="text" id="name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Email *</label>
            <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">學校</label>
            <input type="text" id="school" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">科系</label>
            <input type="text" id="dept" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">現職/頭銜</label>
            <input type="text" id="title" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">專業技能 (逗號分隔)</label>
            <input type="text" id="skills" placeholder="例如: UI/UX, Python, React" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">經歷簡述</label>
          <textarea id="exp" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
        </div>

        <!-- 自我介紹區塊 + Gemini AI 自動生成 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold text-slate-600">自我介紹 (Bio)</label>
            <button type="button" onclick="generateGeminiBio()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1">
              <i class="fa-solid fa-wand-magic-sparkles"></i> AI 協助寫簡介
            </button>
          </div>
          <textarea id="bio" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
        </div>

        <!-- PIN 碼驗證與金鑰 -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
          <label class="block text-xs font-bold text-slate-700 mb-1">設定/輸入 PIN 碼 (4-8位數) *</label>
          <p class="text-xs text-slate-500 mb-2">PIN 碼將作為加密內容的唯一金鑰，資料庫不會儲存原始 PIN 碼。後續編輯或解密皆需此 PIN 碼。</p>
          <input type="password" id="pin" required maxlength="8" placeholder="請輸入安全 PIN 碼" class="w-full md:w-1/2 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm font-mono">
        </div>

        <!-- 按鈕區 -->
        <div class="flex gap-3 pt-2">
          <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition">
            儲存加密名片
          </button>
          <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2 px-4 rounded-lg text-sm transition">
            取消編輯
          </button>
        </div>

      </form>
    </div>

    <!-- 檢視卡片區塊 -->
    <div id="cardDisplay" class="hidden bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
      
      <!-- 頂部防護狀態條 -->
      <div class="bg-slate-800 text-white px-6 py-3 flex justify-between items-center text-xs">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-lock text-emerald-400"></i> 端到端全加密狀態
        </span>
        <span id="lockStatusText" class="text-slate-400">尚未解密</span>
      </div>

      <!-- 名片內容區 -->
      <div class="p-6 space-y-6">
        
        <div class="flex justify-between items-start border-b pb-4">
          <div>
            <h3 id="displayHeaderName" class="text-2xl font-bold text-slate-900">[加密資料]</h3>
            <p id="displayHeaderTitle" class="text-sm text-slate-600">[加密資料]</p>
          </div>
          <div class="space-x-2">
            <button onclick="promptDecrypt()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-md transition">
              <i class="fa-solid fa-key mr-1"></i> 輸入 PIN 解密
            </button>
            <button onclick="promptEdit()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-3 py-1.5 rounded-md transition">
              <i class="fa-solid fa-pen-to-square mr-1"></i> 編輯名片
            </button>
          </div>
        </div>

        <!-- 名片明細列表 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
          <div>
            <span class="block text-xs font-semibold text-slate-400">Email</span>
            <p id="displayEmail" class="font-mono text-slate-700 break-all">[加密資料]</p>
          </div>
          <div>
            <span class="block text-xs font-semibold text-slate-400">學歷/單位</span>
            <p id="displaySchoolDept" class="text-slate-700">[加密資料]</p>
          </div>
          <div class="md:col-span-2">
            <span class="block text-xs font-semibold text-slate-400">專業技能</span>
            <div id="displaySkills" class="flex flex-wrap gap-1 mt-1">
              <span class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded">[加密資料]</span>
            </div>
          </div>
          <div class="md:col-span-2">
            <span class="block text-xs font-semibold text-slate-400">經歷簡述</span>
            <p id="displayExp" class="text-slate-700 whitespace-pre-line">[加密資料]</p>
          </div>
          <div class="md:col-span-2">
            <span class="block text-xs font-semibold text-slate-400">個人簡介 (Bio)</span>
            <p id="displayBio" class="text-slate-700 whitespace-pre-line">[加密資料]</p>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. 初始化 Supabase 設定
    // ==========================================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // 請替換為你的 Supabase URL
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // 請替換為你的 Supabase Anon Key
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 全域變數用於儲存目前讀取的加密名片 Raw Data
    let currentRawCard = null;

    // ==========================================
    // 2. 加密與解密工具函式 (CryptoJS)
    // ==========================================
    
    // AES 加密 (使用 PIN 碼作為 Key)
    function encryptText(plainText, key) {
      if (!plainText) return '';
      return CryptoJS.AES.encrypt(plainText.trim(), key).toString();
    }

    // AES 解密
    function decryptText(cipherText, key) {
      if (!cipherText) return '';
      try {
        const bytes = CryptoJS.AES.decrypt(cipherText, key);
        const originalText = bytes.toString(CryptoJS.enc.Utf8);
        return originalText || null;
      } catch (e) {
        return null;
      }
    }

    // SHA256 雜湊 (用於保護與比對 PIN 碼，不儲存明文)
    function hashPin(pin) {
      return CryptoJS.SHA256(pin.trim()).toString();
    }

    // ==========================================
    // 3. 表單送出 (新增 / 更新加密資料至 Supabase)
    // ==========================================
    async function handleFormSubmit(e) {
      e.preventDefault();

      const cardId = document.getElementById('cardId').value;
      const pin = document.getElementById('pin').value.trim();

      if (!pin || pin.length < 4) {
        alert('請設定至少 4 位數的 PIN 碼！');
        return;
      }

      const pinHash = hashPin(pin);

      // 所有的內容在送出前皆經過 AES 加密
      const payload = {
        pin_hash: pinHash, // 資料庫僅儲存 PIN 的 Hash 值
        name: encryptText(document.getElementById('name').value, pin),
        email: encryptText(document.getElementById('email').value, pin),
        school: encryptText(document.getElementById('school').value, pin),
        dept: encryptText(document.getElementById('dept').value, pin),
        title: encryptText(document.getElementById('title').value, pin),
        skills: encryptText(document.getElementById('skills').value, pin),
        exp: encryptText(document.getElementById('exp').value, pin),
        bio: encryptText(document.getElementById('bio').value, pin)
      };

      let result;

      if (cardId) {
        // 更新模式
        result = await supabase.from('cards').update(payload).eq('id', cardId).select();
      } else {
        // 新增模式
        result = await supabase.from('cards').insert([payload]).select();
      }

      if (result.error) {
        alert('儲存失敗：' + result.error.message);
      } else {
        alert('加密名片儲存成功！');
        const savedCard = result.data[0];
        resetForm();
        renderEncryptedCard(savedCard);
      }
    }

    // ==========================================
    // 4. 卡片渲染與解密控制
    // ==========================================

    // 渲染未解密的原始卡片
    function renderEncryptedCard(cardData) {
      currentRawCard = cardData;
      document.getElementById('cardDisplay').classList.remove('hidden');

      document.getElementById('lockStatusText').innerText = '未解密 (全欄位加密中)';
      document.getElementById('lockStatusText').className = 'text-amber-400';

      document.getElementById('displayHeaderName').innerText = '[密文名片]';
      document.getElementById('displayHeaderTitle').innerText = cardData.title.substring(0, 15) + '...';
      document.getElementById('displayEmail').innerText = cardData.email.substring(0, 20) + '...';
      document.getElementById('displaySchoolDept').innerText = '[密文資料]';
      document.getElementById('displaySkills').innerHTML = '<span class="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded">[密文資料]</span>';
      document.getElementById('displayExp').innerText = cardData.exp.substring(0, 30) + '...';
      document.getElementById('displayBio').innerText = cardData.bio.substring(0, 30) + '...';
    }

    // 跳出 PIN 碼提示進行解密
    function promptDecrypt() {
      if (!currentRawCard) return;

      const userPin = prompt('請輸入 PIN 碼解密名片內容：');
      if (!userPin) return;

      if (hashPin(userPin) !== currentRawCard.pin_hash) {
        alert('PIN 碼錯誤，無法解密！');
        return;
      }

      // 密碼正確，進行解密
      decryptAndDisplay(userPin);
    }

    // 執行解密並更新介面
    function decryptAndDisplay(pin) {
      const name = decryptText(currentRawCard.name, pin) || '[解密失敗]';
      const email = decryptText(currentRawCard.email, pin) || '[解密失敗]';
      const school = decryptText(currentRawCard.school, pin) || '';
      const dept = decryptText(currentRawCard.dept, pin) || '';
      const title = decryptText(currentRawCard.title, pin) || '';
      const skills = decryptText(currentRawCard.skills, pin) || '';
      const exp = decryptText(currentRawCard.exp, pin) || '';
      const bio = decryptText(currentRawCard.bio, pin) || '';

      document.getElementById('lockStatusText').innerText = '已解密查看';
      document.getElementById('lockStatusText').className = 'text-emerald-400';

      document.getElementById('displayHeaderName').innerText = name;
      document.getElementById('displayHeaderTitle').innerText = title;
      document.getElementById('displayEmail').innerText = email;
      document.getElementById('displaySchoolDept').innerText = `${school} ${dept}`.trim() || '未填寫';

      // 技能標籤處理
      const skillsContainer = document.getElementById('displaySkills');
      skillsContainer.innerHTML = '';
      if (skills) {
        skills.split(',').forEach(s => {
          if (s.trim()) {
            const span = document.createElement('span');
            span.className = 'text-xs bg-indigo-50 text-indigo-700 px-2 py-1 rounded border border-indigo-100';
            span.innerText = s.trim();
            skillsContainer.appendChild(span);
          }
        });
      } else {
        skillsContainer.innerText = '無';
      }

      document.getElementById('displayExp').innerText = exp || '無';
      document.getElementById('displayBio').innerText = bio || '無';
    }

    // ==========================================
    // 5. 權限驗證與編輯模式
    // ==========================================

    // 點擊編輯按鈕：輸入 PIN 驗證後帶入表單
    function promptEdit() {
      if (!currentRawCard) return;

      const userPin = prompt('請輸入 PIN 碼以進入編輯模式：');
      if (!userPin) return;

      if (hashPin(userPin) !== currentRawCard.pin_hash) {
        alert('PIN 碼不正確，拒絕存取編輯權限！');
        return;
      }

      // 解密資料並填入表單
      document.getElementById('cardId').value = currentRawCard.id;
      document.getElementById('name').value = decryptText(currentRawCard.name, userPin) || '';
      document.getElementById('email').value = decryptText(currentRawCard.email, userPin) || '';
      document.getElementById('school').value = decryptText(currentRawCard.school, userPin) || '';
      document.getElementById('dept').value = decryptText(currentRawCard.dept, userPin) || '';
      document.getElementById('title').value = decryptText(currentRawCard.title, userPin) || '';
      document.getElementById('skills').value = decryptText(currentRawCard.skills, userPin) || '';
      document.getElementById('exp').value = decryptText(currentRawCard.exp, userPin) || '';
      document.getElementById('bio').value = decryptText(currentRawCard.bio, userPin) || '';
      document.getElementById('pin').value = userPin;

      // 切換表單標題與 UI 狀態
      document.getElementById('formTitle').innerText = '編輯個人名片';
      document.getElementById('editBadge').classList.remove('hidden');
      document.getElementById('cancelEditBtn').classList.remove('hidden');

      // 滾動至表單區塊
      document.getElementById('formContainer').scrollIntoView({ behavior: 'smooth' });
    }

    // 重設表單至新增模式
    function resetForm() {
      document.getElementById('cardForm').reset();
      document.getElementById('cardId').value = '';
      document.getElementById('formTitle').innerText = '建立個人名片';
      document.getElementById('editBadge').classList.add('hidden');
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    // ==========================================
    // 6. Gemini AI 簡介自動生成
    // ==========================================
    async function generateGeminiBio() {
      const name = document.getElementById('name').value;
      const title = document.getElementById('title').value;
      const exp = document.getElementById('exp').value;
      const skills = document.getElementById('skills').value;

      if (!name) {
        alert('請先填寫姓名再使用 AI 產生簡介！');
        return;
      }

      const bioField = document.getElementById('bio');
      bioField.value = 'AI 正在為您撰寫個人簡介中...';

      try {
        const response = await fetch('/api/generate-bio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, title, exp, skills })
        });

        if (response.ok) {
          const data = await response.json();
          bioField.value = data.bio || `我是 ${name}，現任 ${title}，專長包含 ${skills}。歡迎聯繫合作！`;
        } else {
          throw new Error('後端生成失敗');
        }
      } catch (err) {
        // 後端 API 未建置時的預設備用生成邏輯
        bioField.value = `你好！我是 ${name}，目前擔任 ${title || '專業人員'}。擁有 ${skills || '多元專業'} 技能，具備豐富的專案經歷：${exp || '積極創新並持續學習'}。很高興認識大家！`;
      }
    }
  </script>
</body>
</html>
