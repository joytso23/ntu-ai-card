function t(key) {

}

// AES 加密與解密工具
function encryptData(text, key) {
  if (!text) return '';
  return CryptoJS.AES.encrypt(text, key).toString();
}
function decryptData(ciphertext, key) {
  if (!ciphertext) return '';
  try {
    const bytes = CryptoJS.AES.decrypt(ciphertext, key);
    return bytes.toString(CryptoJS.enc.Utf8);
  } catch (e) {
    return '';
  }
}

function hashPin(pin) {
  return CryptoJS.SHA256(pin + '_SALT_NTU_AI').toString();
}

async function init() {
  const loadingDiv = document.getElementById('loading');
  const contentDiv = document.getElementById('content');
  try {
    if (window.supabase && SUPABASE_URL.includes('.supabase.co')) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
    const urlParams = new URLSearchParams(window.location.search);
    const redirectPath = urlParams.get('p');
    let path = redirectPath ? redirectPath : window.location.pathname;
    let pathSegments = path.split('/').filter(Boolean);
    let cardId = pathSegments[pathSegments.length - 1] || '001';
    if (cardId === 'c' || !cardId) cardId = '001';
    
    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from('cards')
        .select('*')
        .eq('card_id', cardId)
        .maybeSingle();
      if (!error && data) currentCardData = data;
    }
    
    loadingDiv.classList.add('hidden');
    contentDiv.classList.remove('hidden');
    
    if (currentCardData && currentCardData.is_active) {
      renderCard(currentCardData, contentDiv);
    } else {
      renderForm(cardId, contentDiv);
    }
  } catch (err) {
    console.error("Init Error:", err);
  }
}

async function generateGeminiBio() {
  const bioInput = document.getElementById('bio');
  const btn = document.getElementById('geminiBtn');
  const btnText = document.getElementById('geminiBtnText');
  
  const name = document.getElementById('name_zh').value || 'Member';
  const school = document.getElementById('school').value || 'NTU';
  const dept = document.getElementById('department').value || '';
  
  const titleInputs = document.querySelectorAll('.title-input');
  const titleArray = Array.from(titleInputs).map(i => i.value.trim()).filter(Boolean);
  const title = titleArray.join('、');
  
  const expInputs = document.querySelectorAll('.exp-input');
  const expArray = Array.from(expInputs).map(i => i.value.trim()).filter(Boolean);
  const exp = expArray.join('、');
  
  const skills = document.getElementById('skills').value || '';

  btn.disabled = true;
  btn.classList.add('opacity-50', 'cursor-not-allowed');
  btnText.innerText = t('aiGenerating');
  bioInput.value = "⚡ Generating bio...";

  try {
    const response = await fetch('/api/generate-bio', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, school, dept, title, exp, skills, lang: currentLang })
    });
    const data = await response.json();
    if (response.ok && data.text) {
      bioInput.value = data.text.trim();
    } else {
      throw new Error('API request failed');
    }
  } catch (e) {
    let fallbackBio = `我是來自 ${school}${dept ? ' ' + dept : ''} 的 ${name}。`;
    if (title) fallbackBio += `目前擔任 ${title}。`;
    if (exp) fallbackBio += `專注於 ${exp} 等領域的實踐與探索，`;
    if (skills) fallbackBio += `並具備 ${skills} 等核心能力。`;
    fallbackBio += `熱衷於持續學習與跨領域挑戰！`;
    bioInput.value = fallbackBio;
  } finally {
    btn.disabled = false;
    btn.classList.remove('opacity-50', 'cursor-not-allowed');
    btnText.innerText = t('aiBtn');
  }
}

function promptEditWithPin() {
  const pin = prompt(t('pinPrompt'));
  if (!pin) return;
  const hashedInput = hashPin(pin);
  if (currentCardData && currentCardData.pin_hash && currentCardData.pin_hash !== hashedInput) {
    alert(t('pinError'));
    return;
  }

  let titlesArray = [];
  try {
    const rawTitle = decryptData(currentCardData.title, PUBLIC_SYS_KEY);
    titlesArray = JSON.parse(rawTitle);
  } catch (e) {
    const rawTitle = decryptData(currentCardData.title, PUBLIC_SYS_KEY);
    if (rawTitle) titlesArray = [rawTitle];
  }

  let experiencesArray = [];
  try {
    const rawExp = decryptData(currentCardData.experience, PUBLIC_SYS_KEY);
    experiencesArray = JSON.parse(rawExp);
  } catch (e) {
    const rawExp = decryptData(currentCardData.experience, PUBLIC_SYS_KEY);
    if (rawExp) experiencesArray = [rawExp];
  }

  const decryptedData = {
    card_id: currentCardData.card_id,
    pin_code: pin,
    name_zh: decryptData(currentCardData.name_zh, PUBLIC_SYS_KEY),
    name_en: decryptData(currentCardData.name_en, PUBLIC_SYS_KEY),
    school: decryptData(currentCardData.school, PUBLIC_SYS_KEY),
    department: decryptData(currentCardData.department, PUBLIC_SYS_KEY),
    titles: titlesArray,
    experiences: experiencesArray,
    skills: decryptData(currentCardData.skills, PUBLIC_SYS_KEY),
    email: decryptData(currentCardData.email, PUBLIC_SYS_KEY),
    instagram: decryptData(currentCardData.instagram, PUBLIC_SYS_KEY),
    linkedin: decryptData(currentCardData.linkedin, PUBLIC_SYS_KEY),
    github: decryptData(currentCardData.github, PUBLIC_SYS_KEY),
    portfolio: decryptData(currentCardData.portfolio, PUBLIC_SYS_KEY),
    bio: decryptData(currentCardData.bio, PUBLIC_SYS_KEY),
    avatar_url: decryptData(currentCardData.avatar_url, PUBLIC_SYS_KEY)
  };

  renderForm(currentCardData.card_id, document.getElementById('content'), decryptedData);
}

async function saveCard(e) {
  e.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.innerText = t('submitting');
  submitBtn.disabled = true;

  const pinKey = document.getElementById('pin_code').value;
  const urlParams = new URLSearchParams(window.location.search);
  const redirectPath = urlParams.get('p');
  let path = redirectPath ? redirectPath : window.location.pathname;
  let pathSegments = path.split('/').filter(Boolean);
  let cardId = pathSegments[pathSegments.length - 1] || '001';
  if (cardId === 'c' || !cardId) cardId = '001';

  const titleInputs = document.querySelectorAll('.title-input');
  const titlesArray = Array.from(titleInputs).map(i => i.value.trim()).filter(Boolean);

  const expInputs = document.querySelectorAll('.exp-input');
  const experiencesArray = Array.from(expInputs).map(i => i.value.trim()).filter(Boolean);

  const cardData = {
    card_id: cardId,
    is_active: true,
    pin_hash: hashPin(pinKey),
    name_zh: encryptData(document.getElementById('name_zh').value, PUBLIC_SYS_KEY),
    name_en: encryptData(document.getElementById('name_en').value, PUBLIC_SYS_KEY),
    school: encryptData(document.getElementById('school').value, PUBLIC_SYS_KEY),
    department: encryptData(document.getElementById('department').value, PUBLIC_SYS_KEY),
    title: encryptData(JSON.stringify(titlesArray), PUBLIC_SYS_KEY),
    experience: encryptData(JSON.stringify(experiencesArray), PUBLIC_SYS_KEY),
    skills: encryptData(document.getElementById('skills').value, PUBLIC_SYS_KEY),
    email: encryptData(document.getElementById('email').value, PUBLIC_SYS_KEY),
    instagram: encryptData(document.getElementById('instagram').value, PUBLIC_SYS_KEY),
    linkedin: encryptData(document.getElementById('linkedin').value, PUBLIC_SYS_KEY),
    github: encryptData(document.getElementById('github').value, PUBLIC_SYS_KEY),
    portfolio: encryptData(document.getElementById('portfolio').value, PUBLIC_SYS_KEY),
    bio: encryptData(document.getElementById('bio').value, PUBLIC_SYS_KEY),
    avatar_url: encryptData(currentAvatarSeed, PUBLIC_SYS_KEY)
  };

  if (supabaseClient) {
    const { error } = await supabaseClient.from('cards').upsert(cardData);
    if (error) {
      alert(t('saveFail') + error.message);
      submitBtn.innerText = t('submitBtn');
      submitBtn.disabled = false;
      return;
    }
  }

  alert(t('saveSuccess'));
  location.reload();
}
